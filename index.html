<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>長友バックパスチャレンジ</title>
  <style>
    :root {
      --ink: #13151a;
      --muted: #58606f;
      --line: rgba(255, 255, 255, 0.72);
      --blue: #1c64d1;
      --red: #d82d3f;
      --yellow: #f2c84b;
      --grass: #16824d;
      --grass-dark: #0f623b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      color: var(--ink);
      font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
      background: #d9f2ff;
    }

    button {
      appearance: none;
      border: 3px solid #151923;
      border-radius: 8px;
      background: #fff;
      color: #151923;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(21, 25, 35, 0.22);
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(21, 25, 35, 0.22);
    }

    .app {
      width: 100vw;
      height: 100dvh;
      min-height: 540px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
      background: linear-gradient(#bfe9ff 0 29%, #eaf8ff 29% 36%, #dff1e8 36% 100%);
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 62px;
    }

    h1 {
      margin: 0;
      font-size: clamp(21px, 6.4vw, 40px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: clamp(12px, 3.3vw, 15px);
      font-weight: 800;
      line-height: 1.2;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(2, 66px);
      gap: 6px;
    }

    .scorebox {
      min-height: 52px;
      padding: 6px;
      border: 2px solid rgba(19, 21, 26, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 4px 0 rgba(19, 21, 26, 0.09);
    }

    .scorebox span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    .scorebox strong {
      display: block;
      margin-top: 1px;
      font-size: 22px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      position: relative;
      overflow: hidden;
      min-height: 0;
      border: 4px solid #151923;
      border-radius: 8px;
      background:
        linear-gradient(var(--line), var(--line)) 0 50% / 100% 4px no-repeat,
        linear-gradient(90deg, var(--line), var(--line)) 50% 0 / 4px 100% no-repeat,
        radial-gradient(circle at 50% 50%, transparent 0 58px, var(--line) 59px 62px, transparent 63px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0 54px, rgba(255, 255, 255, 0.12) 54px 108px),
        linear-gradient(145deg, var(--grass), var(--grass-dark));
      box-shadow: 0 12px 22px rgba(19, 39, 49, 0.2);
      user-select: none;
    }

    .pass-lane {
      position: absolute;
      left: 50%;
      top: 17%;
      bottom: 16%;
      width: clamp(44px, 13vw, 66px);
      transform: translateX(-50%);
      border-left: 3px dashed rgba(255, 255, 255, 0.76);
      border-right: 3px dashed rgba(255, 255, 255, 0.76);
      background: rgba(255, 255, 255, 0.08);
    }

    .goal {
      position: absolute;
      left: 50%;
      bottom: 3%;
      width: 42%;
      height: 58px;
      transform: translateX(-50%);
      border: 4px solid rgba(255, 255, 255, 0.82);
      border-bottom: 0;
    }

    .player,
    .keeper,
    .opponent,
    .ball {
      position: absolute;
      transform: translate(-50%, -50%);
      will-change: transform, left, top;
    }

    .player,
    .keeper,
    .opponent {
      width: clamp(38px, 10.5vw, 58px);
      height: clamp(50px, 13vw, 76px);
      z-index: 4;
    }

    .player {
      left: 50%;
      top: 14%;
    }

    .keeper {
      left: 50%;
      top: 88%;
    }

    .opponent {
      left: var(--x, 50%);
      top: var(--y, 50%);
      z-index: 5;
    }

    .kit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 64%;
      height: 64%;
      transform: translate(-50%, -36%);
      border: 3px solid #151923;
      border-radius: 12px 12px 8px 8px;
      background: linear-gradient(90deg, var(--blue) 0 48%, #fff 48% 55%, var(--blue) 55%);
    }

    .player .kit::after {
      content: "55";
      position: absolute;
      inset: 9px 0 auto;
      color: #fff;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
    }

    .keeper .kit {
      background: var(--yellow);
    }

    .opponent .kit {
      background: var(--red);
    }

    .head {
      position: absolute;
      left: 50%;
      top: 16%;
      width: 40%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 3px solid #151923;
      border-radius: 50%;
      background: #f0b884;
    }

    .opponent .head {
      background: #d79a68;
    }

    .opponent::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 58%;
      width: 86%;
      height: 8px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: #151923;
    }

    .ball {
      left: 50%;
      top: 22%;
      width: clamp(24px, 7vw, 36px);
      aspect-ratio: 1;
      border: 3px solid #151923;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #fff 0 38%, #151923 39% 48%, #fff 49%);
      z-index: 7;
    }

    .ball.ready {
      animation: ball-idle 0.55s infinite alternate ease-in-out;
    }

    .ball.passing {
      transition: top 0.42s linear, left 0.42s linear;
    }

    .ball.caught {
      transition: top 0.14s ease, left 0.14s ease;
    }

    .level-banner {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 9;
      display: grid;
      gap: 5px;
    }

    .level-row {
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
    }

    .meter {
      height: 14px;
      overflow: hidden;
      border: 3px solid #151923;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
    }

    .meter-fill {
      width: 100%;
      height: 100%;
      transform: scaleX(0.1);
      transform-origin: 0 50%;
      background: linear-gradient(90deg, #22b573, #f4c542, #e53935);
    }

    .callout {
      position: absolute;
      left: 50%;
      top: 48%;
      z-index: 12;
      min-width: min(320px, calc(100% - 32px));
      max-width: calc(100% - 32px);
      padding: 12px 14px;
      transform: translate(-50%, -50%);
      border: 3px solid #151923;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      text-align: center;
      font-size: clamp(22px, 7vw, 42px);
      font-weight: 900;
      line-height: 1.05;
      box-shadow: 0 8px 0 rgba(21, 25, 35, 0.18);
      pointer-events: none;
    }

    .callout small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: clamp(12px, 3.5vw, 15px);
      line-height: 1.35;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 112px;
      gap: 8px;
      min-height: 78px;
    }

    .pass-button {
      min-height: 70px;
      background: #e8f2ff;
      font-size: clamp(22px, 7vw, 34px);
    }

    .reset-button {
      min-height: 70px;
      background: #fff6d7;
      font-size: clamp(15px, 4.2vw, 19px);
    }

    @keyframes ball-idle {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(-50%, -42%) scale(1.04); }
    }

    @media (max-height: 620px) {
      .app {
        min-height: 0;
        gap: 6px;
        padding-top: 6px;
        padding-bottom: 6px;
      }

      header {
        min-height: 52px;
      }

      .subtitle {
        display: none;
      }

      .scorebox {
        min-height: 44px;
      }

      .scorebox strong {
        font-size: 19px;
      }

      .controls {
        min-height: 62px;
      }

      .pass-button,
      .reset-button {
        min-height: 58px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>長友バックパスチャレンジ</h1>
        <p class="subtitle">横に動く相手を避けて、キーパーへ通せ。</p>
      </div>
      <div class="scoreboard" aria-live="polite">
        <div class="scorebox">
          <span>LEVEL</span>
          <strong id="levelText">1</strong>
        </div>
        <div class="scorebox">
          <span>BEST</span>
          <strong id="bestText">0</strong>
        </div>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="長友バックパスチャレンジ ゲーム画面">
      <div class="pass-lane"></div>
      <div class="goal"></div>

      <div class="level-banner">
        <div class="level-row">
          <span id="levelName">LEVEL 1</span>
          <span id="speedText">相手 1人</span>
        </div>
        <div class="meter">
          <div class="meter-fill" id="meterFill"></div>
        </div>
      </div>

      <div class="player" aria-hidden="true"><div class="head"></div><div class="kit"></div></div>
      <div class="keeper" aria-hidden="true"><div class="head"></div><div class="kit"></div></div>
      <div class="ball ready" id="ball" aria-hidden="true"></div>
      <div id="opponents"></div>

      <div class="callout" id="message">
        パスを通せ
        <small>相手とボールが重ならないタイミングで通せ。レベル5まで。</small>
      </div>
    </section>

    <nav class="controls" aria-label="操作">
      <button class="pass-button" id="passButton" type="button">パス！</button>
      <button class="reset-button" id="resetButton" type="button">最初から</button>
    </nav>
  </main>

  <script>
    const ball = document.getElementById("ball");
    const opponentsEl = document.getElementById("opponents");
    const message = document.getElementById("message");
    const levelText = document.getElementById("levelText");
    const bestText = document.getElementById("bestText");
    const levelName = document.getElementById("levelName");
    const speedText = document.getElementById("speedText");
    const meterFill = document.getElementById("meterFill");
    const passButton = document.getElementById("passButton");
    const resetButton = document.getElementById("resetButton");

    const levels = [
      { speed: 1.45, count: 1, width: 12, pass: 620 },
      { speed: 1.9, count: 2, width: 12, pass: 590 },
      { speed: 2.35, count: 2, width: 13, pass: 560 },
      { speed: 2.9, count: 3, width: 13, pass: 530 },
      { speed: 3.8, count: 3, width: 14, pass: 500 },
    ];

    const state = {
      level: 1,
      running: false,
      passing: false,
      cleared: false,
      lastTime: 0,
      time: 0,
      passStart: 0,
      passDuration: 0,
      passFrom: 22,
      passTo: 88,
      best: Number(localStorage.getItem("backPassStageBest") || 0),
      opponents: [],
    };

    bestText.textContent = state.best;

    function startGame() {
      state.level = 1;
      state.cleared = false;
      startLevel();
    }

    function startLevel() {
      state.running = true;
      state.passing = false;
      state.lastTime = performance.now();
      state.time = 0;
      resetBall();
      createOpponents();
      updateHud();
      flash(`LEVEL ${state.level}`, "タイミングよくパスを押せ", 760);
      requestAnimationFrame(tick);
    }

    function createOpponents() {
      opponentsEl.innerHTML = "";
      state.opponents = [];
      const cfg = levels[state.level - 1];
      const yPositions = cfg.count === 1 ? [50] : cfg.count === 2 ? [43, 58] : cfg.count === 3 ? [38, 51, 64] : [34, 45, 57, 68];

      yPositions.forEach((y, index) => {
        const el = document.createElement("div");
        el.className = "opponent";
        el.innerHTML = '<div class="head"></div><div class="kit"></div>';
        opponentsEl.appendChild(el);
        state.opponents.push({
          el,
          y,
          phase: index * 1.37,
          direction: index % 2 === 0 ? 1 : -1,
        });
      });
    }

    function resetBall() {
      ball.className = "ball ready";
      ball.style.left = "50%";
      ball.style.top = "22%";
    }

    function updateHud() {
      const cfg = levels[state.level - 1];
      levelText.textContent = state.level;
      bestText.textContent = state.best;
      levelName.textContent = `LEVEL ${state.level}`;
      speedText.textContent = `相手 ${cfg.count}人 / 速度 ${Math.round(cfg.speed * 10)}`;
      meterFill.style.transform = `scaleX(${state.level / levels.length})`;
    }

    function flash(text, detail, duration = 640) {
      message.innerHTML = `${text}<small>${detail}</small>`;
      message.hidden = false;
      clearTimeout(flash.timer);
      flash.timer = setTimeout(() => {
        if (state.running && !state.passing) message.hidden = true;
      }, duration);
    }

    function opponentX(opponent, cfg) {
      const wave = Math.sin(state.time * cfg.speed * opponent.direction + opponent.phase);
      return 50 + wave * 34;
    }

    function updateOpponents() {
      const cfg = levels[state.level - 1];
      state.opponents.forEach((opponent) => {
        const x = opponentX(opponent, cfg);
        opponent.x = x;
        opponent.el.style.setProperty("--x", `${x}%`);
        opponent.el.style.setProperty("--y", `${opponent.y}%`);
      });
    }

    function pass() {
      if (state.cleared) return;
      if (!state.running) {
        startGame();
        setTimeout(pass, 80);
        return;
      }
      if (state.passing) return;

      const cfg = levels[state.level - 1];
      state.passing = true;
      state.passStart = performance.now();
      state.passDuration = cfg.pass;
      state.passFrom = 22;
      state.passTo = 88;
      ball.className = "ball passing";
      ball.style.left = "50%";
      ball.style.top = `${state.passFrom}%`;
    }

    function clearLevel() {
      state.passing = false;
      if (state.level > state.best) {
        state.best = state.level;
        localStorage.setItem("backPassStageBest", String(state.best));
      }

      if (state.level === levels.length) {
        state.running = false;
        state.cleared = true;
        updateHud();
        message.innerHTML = "完全クリア！<small>最後まで通した。これはブラボー。</small>";
        message.hidden = false;
        return;
      }

      state.level += 1;
      state.running = false;
      updateHud();
      flash("クリア！", `次はLEVEL ${state.level}`, 700);
      setTimeout(startLevel, 760);
    }

    function gameOver() {
      state.running = false;
      state.passing = false;
      updateHud();
      message.innerHTML = `奪われた！<small>到達LEVEL ${state.level} / パスで再挑戦</small>`;
      message.hidden = false;
    }

    function tick(now) {
      if (!state.running) return;
      const dt = Math.min(0.04, (now - state.lastTime) / 1000);
      state.lastTime = now;
      state.time += dt;
      updateOpponents();

      if (state.passing) {
        updatePass(now);
        if (!state.passing) {
          if (state.running) requestAnimationFrame(tick);
          return;
        }
        const caughtBy = getCollision();
        if (caughtBy) {
          ball.className = "ball caught";
          ball.style.left = `${caughtBy.x}%`;
          ball.style.top = `${caughtBy.y}%`;
          gameOver();
          return;
        }
      }

      requestAnimationFrame(tick);
    }

    function updatePass(now) {
      const progress = getPassProgress(now);
      const ballY = state.passFrom + (state.passTo - state.passFrom) * progress;
      ball.style.top = `${ballY}%`;
      if (progress >= 1) clearLevel();
    }

    function getPassProgress(now = performance.now()) {
      if (!state.passDuration) return 0;
      const elapsed = now - state.passStart;
      return Math.min(1, Math.max(0, elapsed / state.passDuration));
    }

    function getCollision() {
      const cfg = levels[state.level - 1];
      const progress = getPassProgress();
      const ballY = state.passFrom + (state.passTo - state.passFrom) * progress;
      return state.opponents.find((opponent) => {
        const sameLane = Math.abs(opponent.x - 50) < cfg.width;
        const sameHeight = Math.abs(opponent.y - ballY) < 5.5;
        return sameLane && sameHeight;
      });
    }

    passButton.addEventListener("click", pass);
    resetButton.addEventListener("click", startGame);
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space" || event.code === "Enter") {
        event.preventDefault();
        pass();
      }
    });

    updateHud();
    createOpponents();
    updateOpponents();
    startLevel();
  </script>
</body>
</html>
