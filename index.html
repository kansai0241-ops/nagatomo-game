<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>バックパス危機一髪</title>
  <style>
    :root {
      --ink: #13151a;
      --muted: #59616f;
      --line: rgba(255, 255, 255, 0.72);
      --blue: #1c64d1;
      --red: #e53935;
      --yellow: #f4c542;
      --green: #168754;
      --grass: #17814d;
      --grass-dark: #0f5f38;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      color: var(--ink);
      font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
      background: #d9f2ff;
    }

    button {
      appearance: none;
      border: 3px solid #151923;
      border-radius: 8px;
      background: #fff;
      color: #151923;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(21, 25, 35, 0.22);
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(21, 25, 35, 0.22);
    }

    .app {
      width: 100vw;
      height: 100dvh;
      min-height: 540px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
      background: linear-gradient(#bfe9ff 0 34%, #e6f7ff 34% 42%, #dff1e8 42% 100%);
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 62px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 7vw, 42px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: clamp(12px, 3.4vw, 15px);
      font-weight: 800;
      line-height: 1.2;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(2, 68px);
      gap: 6px;
    }

    .scorebox {
      min-height: 52px;
      padding: 6px;
      border: 2px solid rgba(19, 21, 26, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 4px 0 rgba(19, 21, 26, 0.09);
    }

    .scorebox span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    .scorebox strong {
      display: block;
      margin-top: 1px;
      font-size: 22px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      position: relative;
      overflow: hidden;
      min-height: 0;
      border: 4px solid #151923;
      border-radius: 8px;
      background:
        linear-gradient(var(--line), var(--line)) 0 50% / 100% 4px no-repeat,
        linear-gradient(90deg, var(--line), var(--line)) 50% 0 / 4px 100% no-repeat,
        radial-gradient(circle at 50% 50%, transparent 0 66px, var(--line) 67px 70px, transparent 71px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0 58px, rgba(255, 255, 255, 0.12) 58px 116px),
        linear-gradient(145deg, var(--grass), var(--grass-dark));
      box-shadow: 0 12px 22px rgba(19, 39, 49, 0.2);
      user-select: none;
    }

    .goal {
      position: absolute;
      left: 4%;
      top: 31%;
      width: 54px;
      height: 38%;
      border: 4px solid rgba(255, 255, 255, 0.82);
      border-left: 0;
    }

    .goal::before {
      content: "";
      position: absolute;
      left: 0;
      top: 38%;
      width: 34px;
      height: 24%;
      border: 3px solid rgba(255, 255, 255, 0.7);
      border-left: 0;
    }

    .player,
    .teammate,
    .keeper,
    .opponent,
    .ball {
      position: absolute;
      transform: translate(-50%, -50%);
      will-change: transform, left, top;
    }

    .player,
    .teammate,
    .keeper,
    .opponent {
      width: clamp(36px, 10vw, 58px);
      height: clamp(46px, 13vw, 76px);
    }

    .player {
      left: 31%;
      top: 57%;
    }

    .teammate {
      left: 70%;
      top: 28%;
    }

    .keeper {
      left: 13%;
      top: 50%;
    }

    .opponent {
      left: var(--press-x, 62%);
      top: 57%;
      transition: left 0.08s linear;
    }

    .kit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 64%;
      height: 64%;
      transform: translate(-50%, -36%);
      border: 3px solid #151923;
      border-radius: 12px 12px 8px 8px;
      background: linear-gradient(90deg, var(--blue) 0 48%, #fff 48% 55%, var(--blue) 55%);
    }

    .player .kit::after {
      content: "55";
      position: absolute;
      inset: 9px 0 auto;
      color: #fff;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
    }

    .teammate .kit {
      background: linear-gradient(90deg, #fff 0 46%, var(--blue) 46% 54%, #fff 54%);
    }

    .keeper .kit {
      background: #f4c542;
    }

    .opponent .kit {
      background: #d7223b;
    }

    .head {
      position: absolute;
      left: 50%;
      top: 16%;
      width: 40%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 3px solid #151923;
      border-radius: 50%;
      background: #f0b884;
    }

    .opponent .head {
      background: #d79a68;
    }

    .ball {
      left: var(--ball-x, 38%);
      top: var(--ball-y, 61%);
      width: clamp(24px, 7vw, 38px);
      aspect-ratio: 1;
      border: 3px solid #151923;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #fff 0 38%, #151923 39% 48%, #fff 49%);
      transition: left 0.24s ease, top 0.24s ease;
      z-index: 5;
    }

    .lane {
      position: absolute;
      height: 8px;
      border-radius: 999px;
      opacity: 0.76;
      transform-origin: 0 50%;
      pointer-events: none;
    }

    .lane.forward {
      left: 37%;
      top: 54%;
      width: 38%;
      transform: rotate(-28deg);
      background: rgba(255, 255, 255, 0.78);
    }

    .lane.clear {
      left: 36%;
      top: 64%;
      width: 34%;
      transform: rotate(30deg);
      background: rgba(244, 197, 66, 0.8);
    }

    .lane.back {
      left: 16%;
      top: 58%;
      width: 28%;
      background: rgba(229, 57, 53, 0.8);
    }

    .danger {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 12px;
      display: grid;
      gap: 6px;
      z-index: 8;
    }

    .danger-label {
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
    }

    .danger-track {
      height: 16px;
      overflow: hidden;
      border: 3px solid #151923;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
    }

    .danger-fill {
      width: 100%;
      height: 100%;
      transform: scaleX(0);
      transform-origin: 0 50%;
      background: linear-gradient(90deg, #22b573, #f4c542, #e53935);
    }

    .callout {
      position: absolute;
      left: 50%;
      top: 48%;
      z-index: 10;
      min-width: min(320px, calc(100% - 32px));
      max-width: calc(100% - 32px);
      padding: 12px 14px;
      transform: translate(-50%, -50%);
      border: 3px solid #151923;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      text-align: center;
      font-size: clamp(22px, 7vw, 42px);
      font-weight: 900;
      line-height: 1.05;
      box-shadow: 0 8px 0 rgba(21, 25, 35, 0.18);
      pointer-events: none;
    }

    .callout small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: clamp(12px, 3.5vw, 15px);
      line-height: 1.35;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      min-height: 78px;
    }

    .controls button {
      min-height: 70px;
      padding: 8px 4px;
      font-size: clamp(15px, 4.5vw, 20px);
      line-height: 1.15;
    }

    .controls small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .primary {
      background: #e8f2ff;
    }

    .clear {
      background: #fff6d7;
    }

    .risky {
      background: #ffe7e4;
    }

    @media (max-height: 620px) {
      .app {
        gap: 6px;
        padding-top: 6px;
        padding-bottom: 6px;
        min-height: 0;
      }

      header {
        min-height: 54px;
      }

      .subtitle {
        display: none;
      }

      .scorebox {
        min-height: 46px;
      }

      .scorebox strong {
        font-size: 19px;
      }

      .controls {
        min-height: 64px;
      }

      .controls button {
        min-height: 58px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>バックパス危機一髪</h1>
        <p class="subtitle">奪われる前に判断。前へ出すか、外へ逃がすか。</p>
      </div>
      <div class="scoreboard" aria-live="polite">
        <div class="scorebox">
          <span>SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="scorebox">
          <span>BEST</span>
          <strong id="best">0</strong>
        </div>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="バックパス危機一髪 ゲーム画面">
      <div class="goal"></div>
      <div class="danger">
        <div class="danger-label">
          <span>プレス接近</span>
          <span id="round">1本目</span>
        </div>
        <div class="danger-track">
          <div class="danger-fill" id="dangerFill"></div>
        </div>
      </div>

      <div class="lane forward"></div>
      <div class="lane clear"></div>
      <div class="lane back"></div>

      <div class="keeper" aria-hidden="true"><div class="head"></div><div class="kit"></div></div>
      <div class="teammate" aria-hidden="true"><div class="head"></div><div class="kit"></div></div>
      <div class="player" aria-hidden="true"><div class="head"></div><div class="kit"></div></div>
      <div class="opponent" id="opponent" aria-hidden="true"><div class="head"></div><div class="kit"></div></div>
      <div class="ball" id="ball" aria-hidden="true"></div>

      <div class="callout" id="message">
        ヒヤッと回避
        <small>前へ出す / 外へクリアで開始。バックパスは危険。</small>
      </div>
    </section>

    <nav class="controls" aria-label="操作">
      <button class="primary" id="forwardButton" type="button">前へ出す<small>高得点</small></button>
      <button class="clear" id="clearButton" type="button">外へクリア<small>安全</small></button>
      <button class="risky" id="backButton" type="button">バックパス<small>危険</small></button>
    </nav>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const ball = document.getElementById("ball");
    const opponent = document.getElementById("opponent");
    const message = document.getElementById("message");
    const dangerFill = document.getElementById("dangerFill");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const roundEl = document.getElementById("round");
    const forwardButton = document.getElementById("forwardButton");
    const clearButton = document.getElementById("clearButton");
    const backButton = document.getElementById("backButton");

    const state = {
      running: false,
      over: false,
      score: 0,
      round: 1,
      pressure: 0,
      lastTime: 0,
      messageTimer: 0,
      best: Number(localStorage.getItem("backPassBest") || 0),
    };

    bestEl.textContent = state.best;

    function reset() {
      state.running = true;
      state.over = false;
      state.score = 0;
      state.round = 1;
      state.pressure = 0;
      state.lastTime = performance.now();
      setBall("38%", "61%");
      message.hidden = true;
      updateHud();
      requestAnimationFrame(tick);
    }

    function setBall(x, y) {
      ball.style.setProperty("--ball-x", x);
      ball.style.setProperty("--ball-y", y);
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      bestEl.textContent = state.best;
      roundEl.textContent = `${state.round}本目`;
      dangerFill.style.transform = `scaleX(${Math.min(1, state.pressure)})`;
      const pressX = 62 - state.pressure * 22;
      opponent.style.setProperty("--press-x", `${pressX}%`);
    }

    function flash(text, detail, duration = 620) {
      message.innerHTML = `${text}<small>${detail}</small>`;
      message.hidden = false;
      clearTimeout(state.messageTimer);
      state.messageTimer = setTimeout(() => {
        if (state.running) message.hidden = true;
      }, duration);
    }

    function nextRound(points, text, detail, ballX, ballY) {
      state.score += points;
      state.round += 1;
      state.pressure = Math.max(0, state.pressure * 0.18);
      setBall(ballX, ballY);
      flash(text, detail);
      setTimeout(() => {
        if (!state.running) return;
        setBall("38%", "61%");
      }, 260);
      updateHud();
    }

    function choose(action) {
      if (!state.running) {
        reset();
        return;
      }

      const panic = state.pressure > 0.72;
      const tight = state.pressure > 0.52;

      if (action === "forward") {
        const bonus = panic ? 180 : tight ? 130 : 90;
        nextRound(bonus, "ナイス判断", "前へつけてプレス脱出", "72%", "29%");
        return;
      }

      if (action === "clear") {
        nextRound(65, "まず安全", "外へ逃がしてヒヤッと回避", "78%", "78%");
        return;
      }

      if (panic || tight) {
        endGame("奪われた！", "バックパスを読まれてヒヤッ。画面タップで再挑戦");
        setBall("27%", "55%");
        return;
      }

      nextRound(25, "ギリセーフ", "余裕がある時だけバックパス成功", "14%", "50%");
    }

    function endGame(text, detail) {
      state.running = false;
      state.over = true;
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem("backPassBest", String(state.best));
      }
      updateHud();
      message.innerHTML = `${text}<small>スコア ${state.score} / ${detail}</small>`;
      message.hidden = false;
    }

    function tick(now) {
      if (!state.running) return;
      const dt = Math.min(0.04, (now - state.lastTime) / 1000);
      state.lastTime = now;
      state.pressure += dt * (0.22 + state.round * 0.018);

      if (state.pressure >= 1) {
        endGame("判断遅れ！", "奪われる前に前へ出すか外へクリア");
        return;
      }

      updateHud();
      requestAnimationFrame(tick);
    }

    forwardButton.addEventListener("click", () => choose("forward"));
    clearButton.addEventListener("click", () => choose("clear"));
    backButton.addEventListener("click", () => choose("back"));
    stage.addEventListener("pointerdown", () => {
      if (!state.running) reset();
    });

    window.addEventListener("keydown", (event) => {
      if (event.code === "ArrowUp" || event.code === "KeyF") choose("forward");
      if (event.code === "ArrowRight" || event.code === "KeyC") choose("clear");
      if (event.code === "ArrowLeft" || event.code === "KeyB") choose("back");
      if (event.code === "Space") {
        event.preventDefault();
        if (!state.running) reset();
      }
    });

    updateHud();
  </script>
</body>
</html>
